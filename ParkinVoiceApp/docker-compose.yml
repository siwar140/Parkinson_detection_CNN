# ============================================================
# PARKINVOICE - Orchestration Docker
# ============================================================
services:

  # ----------------------------------------------------------
  # PostgreSQL
  # ----------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: parkinvoice-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - parkinvoice

  # ----------------------------------------------------------
  # Backend FastAPI + TensorFlow
  # ----------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: parkinvoice-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      CORS_ORIGINS: ${CORS_ORIGINS}
      ENVIRONMENT: ${ENVIRONMENT}
      DEBUG: ${DEBUG}
      UPLOAD_DIR: /app/uploads
      MODEL_PATH: /app/models_ia/parkinson_cnn+aug_off_weights_bst.h5
      MODEL_KERAS_PATH: /app/models_ia/parkinson_model.keras
      RESEND_API_KEY: ${RESEND_API_KEY}
    volumes:
      # Monte vos modèles IA et uploads (modifiables sans rebuild)
      - ./backend/models_ia:/app/models_ia
      - ./backend/uploads:/app/uploads
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - parkinvoice

  # ----------------------------------------------------------
  # Frontend React + Nginx
  # ----------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_ENVIRONMENT: ${VITE_ENVIRONMENT}
    container_name: parkinvoice-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - parkinvoice

# ============================================================
# Volumes nommés (persistance des données)
# ============================================================
volumes:
  postgres_data:

# ============================================================
# Réseau interne
# ============================================================
networks:
  parkinvoice:
    driver: bridge